<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#24113d" />
  <title>Pi Browser Connect</title>

  <!-- Required by Pi. Pi Browser does NOT inject window.Pi automatically. -->
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>

  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top, #5c2b86 0, transparent 40%),
        linear-gradient(180deg, #211034 0%, #100918 100%);
      color: #fff;
    }

    .card {
      width: min(100%, 460px);
      padding: 26px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 24px;
      background: rgba(22, 12, 34, .86);
      box-shadow: 0 24px 80px rgba(0,0,0,.34);
      backdrop-filter: blur(12px);
    }

    .logo {
      width: 58px;
      height: 58px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      font-size: 34px;
      font-weight: 800;
      background: #f4b942;
      color: #3d2361;
      margin-bottom: 18px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 28px;
    }

    .sub {
      margin: 0 0 22px;
      color: #cfc4da;
      line-height: 1.5;
    }

    button {
      width: 100%;
      min-height: 52px;
      border: 0;
      border-radius: 15px;
      font-size: 16px;
      font-weight: 750;
      background: #f4b942;
      color: #2c183f;
      cursor: pointer;
    }

    button:disabled {
      opacity: .55;
      cursor: not-allowed;
    }

    #status {
      margin-top: 16px;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,.07);
      color: #ddd4e6;
      line-height: 1.4;
      word-break: break-word;
    }

    .account {
      display: none;
      margin-top: 18px;
      gap: 10px;
    }

    .row {
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(255,255,255,.06);
    }

    .label {
      display: block;
      margin-bottom: 5px;
      color: #a99bb7;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .value {
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .note {
      margin-top: 18px;
      color: #9f91ae;
      font-size: 13px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">π</div>
    <h1>Connect your Pi wallet</h1>
    <p class="sub">
      Authentication is handled by Pi Browser. This page never asks for your wallet passphrase.
    </p>

    <button id="connectBtn">Connect with Pi Browser</button>

    <div id="status">Not connected.</div>

    <section id="account" class="account">
      <div class="row">
        <span class="label">Pi username</span>
        <span id="username" class="value"></span>
      </div>

      <div class="row">
        <span class="label">Verified UID</span>
        <span id="uid" class="value"></span>
      </div>

      <div class="row">
        <span class="label">Wallet address</span>
        <span id="walletAddress" class="value"></span>
      </div>
    </section>

    <p class="note">
      For testing, this project starts in Pi Sandbox/Testnet mode. We can switch it to Mainnet later.
    </p>
  </main>

  <script src="/app.js"></script>
</body>
</html>
